<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jakebitt</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --text: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.5);
            --danger: #f87171;
        }

        body {
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { text-align: center; padding: 4rem 2rem; width: 100%; max-width: 900px; }

        .logo {
            font-size: 3rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block; padding: 0.5rem 1rem; background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent); border-radius: 2rem; font-size: 0.8rem;
            font-weight: 600; color: var(--accent); text-transform: uppercase; cursor: pointer;
        }

        .pulse {
            display: inline-block; width: 8px; height: 8px; background-color: var(--accent);
            border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; width: 100%; }

        .card {
            background: var(--card-bg); padding: 1.8rem; border-radius: 1.2rem;
            border: 1px solid rgba(56, 189, 248, 0.2); text-decoration: none; color: inherit;
            transition: 0.3s; text-align: left; position: relative; cursor: pointer;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); background: rgba(56, 189, 248, 0.08); }
        .card.is-hidden { opacity: 0.4; border-style: dashed; }

        .card-actions { position: absolute; top: 12px; right: 12px; display: none; gap: 6px; }
        .admin-active .card-actions { display: flex; }

        .icon-btn { 
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 6px; border-radius: 8px; cursor: pointer; 
        }

        .admin-bar {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            padding: 0.6rem 1.2rem; border-radius: 3rem; border: 1px solid var(--accent);
            display: flex; gap: 10px; align-items: center; z-index: 100;
        }

        .btn {
            background: var(--accent); color: var(--bg); border: none;
            padding: 0.6rem 1.2rem; border-radius: 2rem; font-weight: 700; cursor: pointer; font-size: 0.75rem;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-content {
            background: #1e293b; padding: 2.5rem; border-radius: 2rem;
            width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1);
        }

        input, textarea, select {
            width: 100%; padding: 12px; margin: 8px 0; background: #0f172a;
            border: 1px solid #334155; border-radius: 10px; color: white; box-sizing: border-box;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body id="main-body">

    <div class="container">
        <div class="logo">jakebitt</div>
        
        <div id="construction-view">
            <p style="font-size: 1.2rem; opacity: 0.7; margin-bottom: 2rem;">Something interesting is brewing.</p>
            <div class="status-badge" onclick="showLogin()">
                <span class="pulse"></span> Under Construction
            </div>
        </div>

        <div id="main-content" class="hidden">
            <p style="font-size: 1.2rem; opacity: 0.7; margin-bottom: 2rem;">The Vault</p>
            <div class="grid" id="project-grid"></div>
        </div>
    </div>

    <div id="admin-bar" class="admin-bar hidden">
        <button class="icon-btn" onclick="toggleMaintenance()" title="Toggle Maintenance">
            <i data-lucide="shield-check" size="16"></i>
        </button>
        <button class="btn" onclick="openModal()">+ Add Card</button>
        <button class="btn" style="background:transparent; color:white; border:1px solid #334155;" onclick="signOut()">Exit</button>
    </div>

    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-content" style="text-align:center;">
            <div style="background: var(--accent); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <i data-lucide="github" style="color: var(--bg)"></i>
            </div>
            <h2 style="margin-bottom: 0.5rem;">Admin</h2>
            <p style="font-size: 0.9rem; opacity: 0.6; margin-bottom: 1.5rem;">Login with GitHub to manage jakebitt.com</p>
            <button class="btn" onclick="signIn('github')" style="width:100%; margin-bottom:10px;">Continue with GitHub</button>
            <button class="btn" onclick="hideLogin()" style="background:transparent; color:white;">Cancel</button>
        </div>
    </div>

    <div id="p-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" style="margin:0 0 1rem 0;">New Project</h3>
            <input type="hidden" id="p-id">
            <input type="text" id="p-title" placeholder="Title">
            <textarea id="p-desc" placeholder="Description"></textarea>
            <input type="text" id="p-url" placeholder="URL">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; align-items:center;">
                <select id="p-icon">
                    <option value="layers">Layers</option>
                    <option value="code">Code</option>
                    <option value="cpu">Hardware</option>
                    <option value="globe">Web</option>
                    <option value="zap">Fast</option>
                    <option value="music">Music</option>
                    <option value="camera">Photo</option>
                    <option value="gamepad-2">Gaming</option>
                </select>
                <label style="font-size:0.8rem; display:flex; align-items:center; gap:5px;">
                    <input type="checkbox" id="p-visible" checked style="width:auto;"> Publicly Visible
                </label>
            </div>
            <div style="display:flex; gap:10px; margin-top:1.5rem;">
                <button class="btn" onclick="saveProject()" style="flex:1;">Save Card</button>
                <button class="btn" onclick="closeModal()" style="flex:1; background:transparent; color:white;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ygukacsyrpoginyledza.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8wx1wqn0uRWKw1WamOWCbw_aL0lVIjv';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // --- PASTE YOUR UID HERE AFTER YOUR FIRST LOGIN ---
        const ADMIN_UID = 'PASTE_YOUR_UID_HERE'; 

        let isMaintenanceOn = true;

        function showLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function hideLogin() { document.getElementById('login-modal').classList.add('hidden'); }
        
        function openModal(editData = null) {
            document.getElementById('p-modal').classList.remove('hidden');
            if (editData) {
                document.getElementById('modal-title').innerText = "Edit Card";
                document.getElementById('p-id').value = editData.id;
                document.getElementById('p-title').value = editData.title;
                document.getElementById('p-desc').value = editData.description;
                document.getElementById('p-url').value = editData.link_url;
                document.getElementById('p-icon').value = editData.icon_name;
                document.getElementById('p-visible').checked = editData.is_visible;
            } else {
                document.getElementById('modal-title').innerText = "New Project";
                document.getElementById('p-id').value = "";
                document.getElementById('p-title').value = "";
                document.getElementById('p-desc').value = "";
                document.getElementById('p-url').value = "";
                document.getElementById('p-visible').checked = true;
            }
        }

        function closeModal() { document.getElementById('p-modal').classList.add('hidden'); }

        async function signIn(provider) { await _supabase.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin } }); }
        async function signOut() { await _supabase.auth.signOut(); window.location.reload(); }

        async function toggleMaintenance() {
            const newVal = !isMaintenanceOn;
            await _supabase.from('site_settings').update({ maintenance_mode: newVal }).eq('id', 1);
            location.reload();
        }

        async function saveProject() {
            const id = document.getElementById('p-id').value;
            const project = {
                title: document.getElementById('p-title').value,
                description: document.getElementById('p-desc').value,
                link_url: document.getElementById('p-url').value,
                icon_name: document.getElementById('p-icon').value,
                is_visible: document.getElementById('p-visible').checked
            };

            if (id) {
                await _supabase.from('projects').update(project).eq('id', id);
            } else {
                await _supabase.from('projects').insert([project]);
            }
            closeModal(); loadProjects();
        }

        async function deleteProject(id, e) {
            e.preventDefault(); e.stopPropagation();
            if(confirm("Delete card?")) {
                await _supabase.from('projects').delete().eq('id', id);
                loadProjects();
            }
        }

        async function loadProjects() {
            const { data: { session } } = await _supabase.auth.getSession();
            const is_admin = session?.user?.id === ADMIN_UID;
            const { data } = await _supabase.from('projects').select('*').order('created_at', { ascending: false });
            
            const grid = document.getElementById('project-grid');
            const displayList = is_admin ? data : (data || []).filter(p => p.is_visible);

            grid.innerHTML = displayList.map(p => `
                <div class="card ${!p.is_visible ? 'is-hidden' : ''}" onclick="window.open('${p.link_url}', '_blank')">
                    <div class="card-actions">
                        <button class="icon-btn" onclick="event.stopPropagation(); openModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                            <i data-lucide="edit-3" size="14"></i>
                        </button>
                        <button class="icon-btn" style="color:var(--danger)" onclick="deleteProject('${p.id}', event)">
                            <i data-lucide="trash-2" size="14"></i>
                        </button>
                    </div>
                    <i data-lucide="${p.icon_name || 'layers'}" style="color:var(--accent); margin-bottom:12px;"></i>
                    <h3 style="margin:0; font-size:1.1rem;">${p.title}</h3>
                    <p style="font-size:0.85rem; margin:8px 0 0 0; opacity:0.6; line-height:1.5;">${p.description}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            const { data: settings } = await _supabase.from('site_settings').select('maintenance_mode').single();
            isMaintenanceOn = settings?.maintenance_mode;
            const is_admin = session?.user?.id === ADMIN_UID;
            
            if (!isMaintenanceOn || is_admin) {
                document.getElementById('construction-view').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                loadProjects();
                if (is_admin) {
                    document.getElementById('admin-bar').classList.remove('hidden');
                    document.getElementById('main-body').classList.add('admin-active');
                }
            }
            lucide.createIcons();
        }
        init();
    </script>
</body>
</html>
