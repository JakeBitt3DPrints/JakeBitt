<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakeBitt</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --text: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.5);
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 4rem 2rem;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.2rem;
            opacity: 0.7;
            margin-bottom: 2rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            cursor: pointer;
        }

        .pulse {
            display: inline-block;
            width: 8px; height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* --- CENTERED PROJECT GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            padding: 1.8rem;
            border-radius: 1.2rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
            text-align: left;
        }
        .card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: rgba(56, 189, 248, 0.08);
        }

        /* --- ADMIN BAR --- */
        .admin-bar {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            padding: 0.6rem 1.2rem; border-radius: 3rem; border: 1px solid var(--accent);
            display: flex; gap: 0.8rem; align-items: center; z-index: 100;
        }

        .btn {
            background: var(--accent); color: var(--bg); border: none;
            padding: 0.5rem 1rem; border-radius: 2rem; font-weight: 700; cursor: pointer; font-size: 0.75rem;
        }

        .toggle-btn {
            background: transparent; color: var(--accent); border: 1px solid var(--accent);
            padding: 0.4rem; border-radius: 50%; display: flex; align-items: center; cursor: pointer;
        }

        .hidden { display: none !important; }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-content {
            background: #1e293b; padding: 2rem; border-radius: 1.5rem;
            width: 90%; max-width: 400px; border: 1px solid var(--accent);
        }
        input, textarea, select {
            width: 100%; padding: 10px; margin: 10px 0; background: #0f172a;
            border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">jakebitt</div>
        
        <div id="construction-view">
            <p class="subtitle">Building something interesting.</p>
            <div class="status-badge" onclick="showLogin()">
                <span class="pulse"></span>
                Under Construction
            </div>
        </div>

        <div id="main-content" class="hidden">
            <p class="subtitle" id="main-text">Projects & Creations</p>
            <div class="grid" id="project-grid"></div>
        </div>
    </div>

    <div id="admin-bar" class="admin-bar hidden">
        <button class="toggle-btn" onclick="toggleMaintenance()" title="Toggle Maintenance Mode">
            <i data-lucide="settings" size="16"></i>
        </button>
        <button class="btn" onclick="openModal()">+ Card</button>
        <button class="btn" style="background:transparent; color:white; border:1px solid #334155;" onclick="signOut()">Exit</button>
    </div>

    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-content" style="text-align:center;">
            <h2 style="margin-top:0;">Admin</h2>
            <button class="btn" onclick="signIn('apple')" style="width:100%; margin-bottom:10px;">Login with Apple</button>
            <button class="btn" onclick="hideLogin()" style="width:100%; background:transparent; color:white;">Cancel</button>
        </div>
    </div>

    <div id="p-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin:0;">New Card</h3>
            <input type="text" id="p-title" placeholder="Title">
            <textarea id="p-desc" placeholder="Description"></textarea>
            <input type="text" id="p-url" placeholder="Link URL">
            <select id="p-icon">
                <option value="layers">Layers</option>
                <option value="code">Code</option>
                <option value="cpu">Hardware</option>
                <option value="printer">3D Print</option>
                <option value="zap">Fast</option>
            </select>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn" onclick="saveProject()" style="flex:1;">Save</button>
                <button class="btn" onclick="closeModal()" style="flex:1; background:transparent; color:white;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ygukacsyrpoginyledza.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8wx1wqn0uRWKw1WamOWCbw_aL0lVIjv';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const ADMIN_EMAIL = 'jacobbittner834@icloud.com';
        let isMaintenanceOn = true;

        function showLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function hideLogin() { document.getElementById('login-modal').classList.add('hidden'); }
        function openModal() { document.getElementById('p-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('p-modal').classList.add('hidden'); }

        async function signIn(provider) { await _supabase.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin } }); }
        async function signOut() { await _supabase.auth.signOut(); window.location.reload(); }

        async function toggleMaintenance() {
            const newVal = !isMaintenanceOn;
            const { error } = await _supabase.from('site_settings').update({ maintenance_mode: newVal }).eq('id', 1);
            if (!error) {
                alert(`Maintenance mode is now ${newVal ? 'ON' : 'OFF'}. Refresh to see public view.`);
                location.reload();
            }
        }

        async function saveProject() {
            const project = {
                title: document.getElementById('p-title').value,
                description: document.getElementById('p-desc').value,
                link_url: document.getElementById('p-url').value,
                icon_name: document.getElementById('p-icon').value
            };
            const { error } = await _supabase.from('projects').insert([project]);
            if (!error) { closeModal(); loadProjects(); }
        }

        async function loadProjects() {
            const { data } = await _supabase.from('projects').select('*').order('created_at', { ascending: false });
            const grid = document.getElementById('project-grid');
            grid.innerHTML = (data || []).map(p => `
                <a href="${p.link_url}" target="_blank" class="card">
                    <i data-lucide="${p.icon_name || 'layers'}" style="color:var(--accent); margin-bottom:10px;"></i>
                    <h3 style="margin:0; font-size:1.1rem;">${p.title}</h3>
                    <p style="font-size:0.85rem; margin:8px 0 0 0; opacity:0.6; line-height:1.4;">${p.description}</p>
                </a>
            `).join('');
            lucide.createIcons();
        }

        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            const { data: settings } = await _supabase.from('site_settings').select('maintenance_mode').single();
            isMaintenanceOn = settings?.maintenance_mode;
            
            const is_admin = session?.user?.email === ADMIN_EMAIL;
            
            if (!isMaintenanceOn || is_admin) {
                document.getElementById('construction-view').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                loadProjects();
                if (is_admin) document.getElementById('admin-bar').classList.remove('hidden');
            }
            lucide.createIcons();
        }
        init();
    </script>
</body>
</html>
