<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jakebitt</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --text: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.5);
            --danger: #f87171;
        }
        body {
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container { text-align: center; padding: 4rem 2rem; width: 100%; max-width: 900px; }
        .logo {
            font-size: 3.5rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 1.2rem; opacity: 0.7; margin-bottom: 2rem; }
        .status-badge {
            display: inline-block; padding: 0.6rem 1.2rem; background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent); border-radius: 2rem; font-size: 0.85rem;
            font-weight: 600; color: var(--accent); text-transform: uppercase;
            cursor: pointer; transition: all 0.3s ease;
        }
        .status-badge:hover { background: rgba(56, 189, 248, 0.2); transform: scale(1.05); box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .pulse { display: inline-block; width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56,189,248,0.7); } 70% { box-shadow: 0 0 0 10px rgba(56,189,248,0); } 100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; width: 100%; }
        .card {
            background: var(--card-bg); padding: 1.8rem; border-radius: 1.2rem;
            border: 1px solid rgba(56, 189, 248, 0.2); text-decoration: none; color: inherit;
            transition: all 0.3s ease; text-align: left; position: relative; cursor: pointer; display: block;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .card.is-hidden { opacity: 0.5; border-style: dashed; }
        .card.is-featured::after {
            content: "★ Featured"; position: absolute; top: 12px; right: 12px;
            background: #eab308; color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 9999px;
            z-index: 10;
        }
        .card-actions { position: absolute; top: 12px; left: 12px; display: none; gap: 6px; z-index: 20; }
        .admin-active .card-actions { display: flex; }
        .icon-btn {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 6px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .icon-btn:hover { background: #334155; transform: scale(1.1); }

        .admin-bar {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            padding: 0.6rem 1.2rem; border-radius: 3rem; border: 1px solid var(--accent);
            display: flex; gap: 10px; align-items: center; z-index: 100;
        }
        .btn {
            background: var(--accent); color: var(--bg); border: none;
            padding: 0.6rem 1.2rem; border-radius: 2rem; font-weight: 700; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(56 189 248 / 0.3); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-content {
            background: #1e293b; padding: 2.5rem; border-radius: 2rem;
            width: 90%; max-width: 460px; border: 1px solid rgba(255,255,255,0.1);
        }
        #icon-picker .modal-content { max-width: 560px; }
        #icon-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px; max-height: 380px; overflow-y: auto; padding: 10px;
        }
        .icon-option {
            text-align: center; cursor: pointer; padding: 12px 8px; border-radius: 12px;
            transition: all 0.2s; border: 2px solid transparent;
        }
        .icon-option:hover, .icon-option.selected {
            background: rgba(56,189,248,0.15); border-color: var(--accent); transform: scale(1.08);
        }
        .icon-option i { font-size: 32px; display: block; margin-bottom: 6px; color: var(--accent); }
        .icon-option span { font-size: 0.75rem; opacity: 0.7; display: block; }

        input, textarea, select {
            width: 100%; padding: 12px; margin: 8px 0; background: #0f172a;
            border: 1px solid #334155; border-radius: 10px; color: white; box-sizing: border-box;
        }
        input[type="color"] {
            width: 60px; height: 48px; padding: 4px; border: none; cursor: pointer;
            background: transparent; border-radius: 8px;
        }
        .color-wrapper { display: flex; align-items: center; gap: 10px; }

        /* Nice toggles */
        .toggle-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0;
        }
        .toggle-label {
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;
            background: #1e293b; padding: 12px 16px; border-radius: 12px; transition: all 0.2s;
        }
        .toggle-label:hover { background: rgba(56,189,248,0.1); }
        .toggle-label input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
        }

        /* Toast */
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: #1e293b; color: white; padding: 12px 20px; border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); display: flex; align-items: center; gap: 12px;
            animation: toast-in 0.3s ease;
        }
        .toast.success { border-left: 4px solid #38bdf8; }
        .toast.error { border-left: 4px solid var(--danger); }
        @keyframes toast-in { from { opacity: 0; transform: translateY(20px); } }

        .loader { border: 3px solid #334155; border-top: 3px solid var(--accent); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        /* Persistent admin button */
        #persistent-admin-btn {
            position: fixed; top: 25px; right: 25px; z-index: 150;
            background: rgba(15,23,42,0.95); color: var(--accent);
            padding: 10px 18px; border-radius: 9999px; border: 1px solid var(--accent);
            cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
        #project-search {
            width: 100%; max-width: 400px; margin: 1rem auto; padding: 12px 16px;
            background: #1e293b; border: 1px solid #334155; border-radius: 9999px; color: white;
        }
    </style>
</head>
<body id="main-body">
    <div class="container">
        <div class="logo">jakebitt</div>

        <div id="construction-view" class="hidden">
            <p class="subtitle">Building something interesting.</p>
            <div class="status-badge" onclick="showLogin()">
                <span class="pulse"></span> Under Construction
            </div>
        </div>

        <div id="main-content">
            <p class="subtitle">My Projects</p>
            <input type="text" id="project-search" placeholder="Search projects..." onkeyup="filterProjects()">
            <div id="loading" class="hidden"><div class="loader"></div></div>
            <div class="grid" id="project-grid"></div>
            <div id="empty-state" class="hidden" style="padding:3rem;opacity:0.6;">No projects yet. Add some from the admin bar.</div>
        </div>
    </div>

    <!-- Persistent Admin Button -->
    <div id="persistent-admin-btn" class="hidden" onclick="showLogin()">
        <i data-lucide="key" size="18"></i>
        <span>Admin Login</span>
    </div>

    <!-- Admin Bar -->
    <div id="admin-bar" class="admin-bar hidden">
        <button class="icon-btn" onclick="toggleMaintenance()" title="Toggle Maintenance"><i data-lucide="shield-check" size="16"></i></button>
        <button class="icon-btn" onclick="loadProjects()" title="Refresh Projects"><i data-lucide="refresh-cw" size="16"></i></button>
        <button class="btn" onclick="openModal()">+ Add Card</button>
        <button class="btn" style="background:transparent;color:white;border:1px solid #334155;" onclick="signOut()">Logout</button>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-content" style="text-align:center;">
            <div style="background:var(--accent);width:48px;height:48px;border-radius:50%;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;">
                <i data-lucide="github" style="color:var(--bg)"></i>
            </div>
            <h2>Admin Login</h2>
            <p style="opacity:0.6;margin:1rem 0;">Continue to manage jakebitt.com</p>
            <button class="btn" onclick="signIn('github')" style="width:100%;margin-bottom:10px;">Login with GitHub</button>
            <button class="btn" onclick="hideLogin()" style="background:transparent;color:white;width:100%;">Cancel</button>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="p-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title">New Card</h3>
            <input type="hidden" id="p-id">

            <!-- Live Preview -->
            <div id="live-preview" class="card" style="margin:15px 0;padding:1rem;pointer-events:none;background:rgba(30,41,59,0.8);border:1px solid #334155;">
                <i id="preview-icon" data-lucide="layers" style="color:#38bdf8;margin-bottom:8px;font-size:1.8rem;"></i>
                <h3 id="preview-title" style="margin:0;font-size:1.1rem;">Title</h3>
                <p id="preview-desc" style="font-size:0.85rem;margin:8px 0 0 0;opacity:0.7;">Description</p>
            </div>

            <input type="text" id="p-title" placeholder="Title" required oninput="debouncedPreview()">
            <textarea id="p-desc" placeholder="Description" rows="3" oninput="debouncedPreview()"></textarea>
            <input type="url" id="p-url" placeholder="https://youtube.com/..." required>

            <div class="color-wrapper">
                <input type="text" id="p-icon" readonly placeholder="Click to pick icon" style="flex:1;cursor:pointer;" onclick="openIconPicker()">
                <input type="color" id="p-color" value="#38bdf8" oninput="debouncedPreview()">
            </div>

            <!-- Nicer toggles -->
            <div class="toggle-group">
                <label class="toggle-label">
                    <input type="checkbox" id="p-new-tab" checked>
                    <span>Open in new tab (YouTube, external sites)</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="p-visible" checked>
                    <span>Public (visible to everyone)</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="p-featured">
                    <span>Featured (★ badge)</span>
                </label>
            </div>

            <div style="display:flex;gap:10px;margin-top:1.5rem;">
                <button class="btn" onclick="saveProject()" style="flex:1;">Save</button>
                <button class="btn" onclick="closeModal()" style="flex:1;background:transparent;color:white;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Icon Picker Modal -->
    <div id="icon-picker" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-bottom:1rem;">Choose Icon (120+ options)</h3>
            <input type="text" id="icon-search" placeholder="Search icons..." style="margin-bottom:15px;" onkeyup="filterIcons()">
            <div id="icon-grid"></div>
            <div style="display:flex;gap:10px;margin-top:20px;">
                <button class="btn" onclick="closeIconPicker()" style="flex:1;background:transparent;color:white;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        const SUPABASE_URL = 'https://ygukacsyrpoginyledza.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8wx1wqn0uRWKw1WamOWCbw_aL0lVIjv';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const ADMIN_UID = '11edec92-4080-4d70-8913-39c1b743ab0d';

        let isMaintenanceOn = true;
        let currentEditId = null;
        let projectsChannel = null;
        let allProjects = [];
        let previewTimeout = null;

        const availableIcons = ['layers','code','cpu','globe','zap','github','link','external-link','home','briefcase','book','award','star','heart','play-circle','music','image','video','file-text','folder','settings','user','users','mail','phone','map-pin','calendar','clock','trending-up','shield','key','lock','eye','thumbs-up','message-circle','share-2','download','upload','refresh-cw','edit','trash','plus','minus','x','check','arrow-right','activity','bar-chart','pie-chart','database','server','cloud','wifi','smartphone','monitor','tablet','target','rocket','lightbulb','eye-off','bluetooth','camera','facebook','twitter','instagram','linkedin','youtube','twitch','discord','slack','figma','git','git-branch','git-merge','terminal','command','package','box','truck','shopping-cart','credit-card','dollar-sign','percent','award','trophy','medal','flag','map','compass','sun','moon','cloud-rain','thermometer','droplet','wind','leaf','flower','tree','mountain','umbrella','anchor','boat','plane','car','bike','train','bus','subway','zap','battery','plug','wifi-off','signal','volume','volume-2','mic','mic-off','headphones','speaker','radio','tv','monitor','laptop','smartphone','watch','glasses','hat','shirt','shoe','bag','backpack','briefcase','wallet','key','lock','unlock','eye','eye-off','bell','bell-off','bell-ring','alert-triangle','check-circle','x-circle','info','help-circle','question','plus-circle','minus-circle','trash-2','edit-3','save','download-cloud','upload-cloud','refresh-ccw','rotate-cw','arrow-left','arrow-right','arrow-up','arrow-down','chevron-left','chevron-right','chevron-up','chevron-down','corner-up-left','corner-up-right','move','maximize','minimize'];

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `${type === 'success' ? '✓' : '⚠'} ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function hideLogin() { document.getElementById('login-modal').classList.add('hidden'); }
        function closeModal() { document.getElementById('p-modal').classList.add('hidden'); currentEditId = null; }
        function closeIconPicker() { document.getElementById('icon-picker').classList.add('hidden'); }

        function debouncedPreview() {
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(updatePreview, 80);
        }

        function updatePreview() {
            const title = document.getElementById('p-title').value || 'Title';
            const desc = document.getElementById('p-desc').value || 'Description';
            const icon = document.getElementById('p-icon').value || 'layers';
            const color = document.getElementById('p-color').value;

            document.getElementById('preview-title').textContent = title;
            document.getElementById('preview-desc').textContent = desc;
            const iconEl = document.getElementById('preview-icon');
            iconEl.setAttribute('data-lucide', icon);
            iconEl.style.color = color;
            lucide.createIcons();
        }

        function openModal(editData = null) {
            const modal = document.getElementById('p-modal');
            modal.classList.remove('hidden');
            currentEditId = editData ? editData.id : null;
            document.getElementById('modal-title').textContent = editData ? 'Edit Card' : 'New Card';
            
            if (editData) {
                document.getElementById('p-id').value = editData.id;
                document.getElementById('p-title').value = editData.title || '';
                document.getElementById('p-desc').value = editData.description || '';
                document.getElementById('p-url').value = editData.link_url || '';
                document.getElementById('p-icon').value = editData.icon_name || 'layers';
                document.getElementById('p-color').value = editData.icon_color || '#38bdf8';
                document.getElementById('p-new-tab').checked = editData.open_in_new_tab ?? true;
                document.getElementById('p-visible').checked = editData.is_visible ?? true;
                document.getElementById('p-featured').checked = editData.is_featured ?? false;
            } else {
                document.getElementById('p-title').value = '';
                document.getElementById('p-desc').value = '';
                document.getElementById('p-url').value = '';
                document.getElementById('p-icon').value = 'layers';
                document.getElementById('p-color').value = '#38bdf8';
                document.getElementById('p-new-tab').checked = true;
                document.getElementById('p-visible').checked = true;
                document.getElementById('p-featured').checked = false;
            }
            updatePreview();
        }

        function openIconPicker() {
            document.getElementById('icon-picker').classList.remove('hidden');
            renderIconGrid();
        }

        function renderIconGrid(filtered = availableIcons) {
            const grid = document.getElementById('icon-grid');
            grid.innerHTML = filtered.map(icon => `
                <div class="icon-option" onclick="selectIcon('${icon}')">
                    <i data-lucide="${icon}"></i>
                    <span>${icon}</span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function filterIcons() {
            const term = document.getElementById('icon-search').value.toLowerCase().trim();
            const filtered = availableIcons.filter(icon => icon.toLowerCase().includes(term));
            renderIconGrid(filtered);
        }

        function selectIcon(iconName) {
            document.getElementById('p-icon').value = iconName;
            closeIconPicker();
            debouncedPreview();
        }

        async function signIn(provider) {
            await _supabase.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin } });
        }
        async function signOut() {
            await _supabase.auth.signOut();
            location.reload();
        }

        async function isAdmin() {
            const { data: { session } } = await _supabase.auth.getSession();
            return session?.user?.id === ADMIN_UID;
        }

        async function toggleMaintenance() {
            if (!(await isAdmin())) return showToast('Not authorized', 'error');
            const newVal = !isMaintenanceOn;
            const { error } = await _supabase.from('site_settings').update({ maintenance_mode: newVal }).eq('id', 1);
            if (error) showToast('Failed to update', 'error');
            else location.reload();
        }

        async function saveProject() {
            if (!(await isAdmin())) return showToast('Not authorized', 'error');
            const project = {
                title: document.getElementById('p-title').value.trim(),
                description: document.getElementById('p-desc').value.trim(),
                link_url: document.getElementById('p-url').value.trim(),
                icon_name: document.getElementById('p-icon').value,
                icon_color: document.getElementById('p-color').value,
                open_in_new_tab: document.getElementById('p-new-tab').checked,
                is_visible: document.getElementById('p-visible').checked,
                is_featured: document.getElementById('p-featured').checked
            };

            let error;
            if (currentEditId) {
                ({ error } = await _supabase.from('projects').update(project).eq('id', currentEditId));
            } else {
                ({ error } = await _supabase.from('projects').insert([project]));
            }

            if (error) showToast(error.message, 'error');
            else {
                showToast(currentEditId ? 'Project updated' : 'Project added');
                closeModal();
                loadProjects();
            }
        }

        async function deleteProject(id) {
            if (!(await isAdmin())) return showToast('Not authorized', 'error');
            if (!confirm('Delete permanently?')) return;
            const { error } = await _supabase.from('projects').delete().eq('id', id);
            if (error) showToast('Delete failed', 'error');
            else {
                showToast('Project deleted');
                loadProjects();
            }
        }

        async function editProject(id) {
            const { data } = await _supabase.from('projects').select('*').eq('id', id).single();
            if (data) openModal(data);
        }

        function handleCardClick(e) {
            const card = e.currentTarget;
            const url = card.dataset.url;
            const newTab = card.dataset.newTab === 'true';
            if (!url || url === '#') return;
            if (newTab) {
                window.open(url, '_blank');
            } else {
                window.location.href = url;
            }
        }

        function renderProjectCards(data) {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = data.map(p => `
                <div class="card ${!p.is_visible ? 'is-hidden' : ''} ${p.is_featured ? 'is-featured' : ''}"
                     data-url="${p.link_url || '#'}" data-new-tab="${p.open_in_new_tab || false}">
                    <div class="card-actions">
                        <button class="icon-btn" onclick="event.stopPropagation(); editProject('${p.id}')"><i data-lucide="edit-3" size="14"></i></button>
                        <button class="icon-btn" style="color:var(--danger)" onclick="event.stopPropagation(); deleteProject('${p.id}')"><i data-lucide="trash-2" size="14"></i></button>
                    </div>
                    <i data-lucide="${p.icon_name || 'layers'}" style="color:${p.icon_color || 'var(--accent)'};margin-bottom:12px;font-size:1.8rem;"></i>
                    <h3 style="margin:0;font-size:1.15rem;">${p.title}</h3>
                    <p style="font-size:0.85rem;margin:10px 0 0 0;opacity:0.7;line-height:1.5;">${p.description || ''}</p>
                </div>
            `).join('');
            lucide.createIcons();

            // Clean click handlers (fixes edit + link issues)
            document.querySelectorAll('#project-grid .card').forEach(card => {
                card.addEventListener('click', handleCardClick);
            });
        }

        function filterProjects() {
            const term = document.getElementById('project-search').value.toLowerCase().trim();
            const filtered = allProjects.filter(p => 
                p.title.toLowerCase().includes(term) || 
                (p.description && p.description.toLowerCase().includes(term))
            );
            renderProjectCards(filtered);
        }

        async function loadProjects() {
            document.getElementById('loading').classList.remove('hidden');
            const admin = await isAdmin();
            
            let query = _supabase.from('projects').select('*').order('created_at', { ascending: false });
            if (!admin) query = query.eq('is_visible', true);
            
            const { data, error } = await query;
            if (error) showToast('Failed to load projects', 'error');
            allProjects = data || [];

            if (!allProjects.length) {
                document.getElementById('empty-state').classList.remove('hidden');
            } else {
                document.getElementById('empty-state').classList.add('hidden');
                renderProjectCards(allProjects);
            }
            document.getElementById('loading').classList.add('hidden');
        }

        async function init() {
            const [sessionRes, settingsRes] = await Promise.all([
                _supabase.auth.getSession(),
                _supabase.from('site_settings').select('maintenance_mode').single()
            ]);

            isMaintenanceOn = settingsRes.data?.maintenance_mode ?? true;
            const admin = sessionRes.data?.session?.user?.id === ADMIN_UID;

            if (!isMaintenanceOn || admin) {
                document.getElementById('construction-view').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                loadProjects();

                if (admin) {
                    document.getElementById('admin-bar').classList.remove('hidden');
                    document.getElementById('main-body').classList.add('admin-active');
                }
            } else {
                document.getElementById('construction-view').classList.remove('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }

            if (!isMaintenanceOn && !admin) {
                document.getElementById('persistent-admin-btn').classList.remove('hidden');
            } else {
                document.getElementById('persistent-admin-btn').classList.add('hidden');
            }

            if (projectsChannel) projectsChannel.unsubscribe();
            projectsChannel = _supabase.channel('projects-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, loadProjects)
                .subscribe();

            lucide.createIcons();
        }

        _supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') init();
        });

        document.addEventListener('keydown', e => { 
            if (e.key === 'Escape') { 
                closeModal(); 
                closeIconPicker(); 
                hideLogin(); 
            } 
        });
        document.getElementById('p-modal').addEventListener('click', e => { if (e.target.id === 'p-modal') closeModal(); });
        document.getElementById('login-modal').addEventListener('click', e => { if (e.target.id === 'login-modal') hideLogin(); });
        document.getElementById('icon-picker').addEventListener('click', e => { if (e.target.id === 'icon-picker') closeIconPicker(); });

        init();
    </script>
</body>
</html>
