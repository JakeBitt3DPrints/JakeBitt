<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakeBitt</title>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.7;
        }
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
        }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0   rgba(56, 189, 248, 0.7); }
            70%  { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0);   }
            100% { box-shadow: 0 0 0 0   rgba(56, 189, 248, 0);   }
        }

        /* ── Tools section ── */
        .tools-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(248,250,252,0.3);
        }
        .tools-grid {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tool-card {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.9rem 1.25rem;
            background: rgba(56,189,248,0.06);
            border: 1px solid rgba(56,189,248,0.18);
            border-radius: 0.85rem;
            text-decoration: none;
            color: var(--text);
            transition: background .2s, border-color .2s, transform .2s;
            text-align: left;
            min-width: 210px;
        }
        .tool-card:hover {
            background: rgba(56,189,248,0.13);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .tool-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            width: 2.5rem;
            height: 2.5rem;
            background: rgba(56,189,248,0.1);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-info {}
        .tool-name {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.15rem;
        }
        .tool-desc {
            font-size: 0.72rem;
            color: rgba(248,250,252,0.5);
        }
        .tool-arrow {
            margin-left: auto;
            color: rgba(56,189,248,0.4);
            font-size: 0.9rem;
            transition: transform .2s, color .2s;
        }
        .tool-card:hover .tool-arrow {
            transform: translateX(3px);
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">jakebitt</div>
        <p>Building something interesting.</p>
        <div class="status-badge">
            <span class="pulse"></span>
            Under Construction
        </div>

        <div class="tools-label">Tools</div>
        <div class="tools-grid">
            <a class="tool-card" href="/printcalc">
                <div class="tool-icon">🖨️</div>
                <div class="tool-info">
                    <div class="tool-name">3D Print Pricing</div>
                    <div class="tool-desc">Calculate costs & margins</div>
                </div>
                <span class="tool-arrow">→</span>
            </a>
            <a class="tool-card" href="/lithogen">
                <div class="tool-icon">🖼️</div>
                <div class="tool-info">
                    <div class="tool-name">Lithophane Generator</div>
                    <div class="tool-desc">Image → 3D-printable STL</div>
                </div>
                <span class="tool-arrow">→</span>
            </a>
            <a class="tool-card" href="/cad">
                <div class="tool-icon">💻</div>
                <div class="tool-info">
                    <div class="tool-name">JakeCAD Studio</div>
                    <div class="tool-desc">Easy to use Web Based CAD</div>
                </div>
                <span class="tool-arrow">→</span>
            </a>
            <a class="tool-card" href="/skins">
                <div class="tool-icon">🧍</div>
                <div class="tool-info">
                    <div class="tool-name">Skin Studio</div>
                    <div class="tool-desc">Minecraft skin editor &amp; maker</div>
                </div>
                <span class="tool-arrow">→</span>
            </a>
        </div>
    </div>
</body>
</html>
